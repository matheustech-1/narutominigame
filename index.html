<style>
/* Layout: coluna central escura. Menu e mapa em lista; batalha em arena de duas laterais com painel de ações embaixo. Visual único e escuro de propósito. */
:root{
  --ink:#0d0a10; --ink2:#17121c; --panel:#1d1724; --line:#35293f;
  --paper:#efe7d8; --mute:#a99fb5; --seal:#e0452f; --gold:#e3b04b;
  --chakra:#47b3e6; --hp:#e0452f; --good:#6ccf8f;
  --fogo:#f2662c; --agua:#3d9be0; --vento:#7fd6a8; --raio:#f2d03b; --terra:#c19a5b;
  --display:"Staatliches","Impact","Arial Narrow",sans-serif;
  --text:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--ink);color:var(--paper);font:16px/1.5 var(--text);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(900px 520px at 85% -10%,#3b1721 0,transparent 60%),radial-gradient(700px 520px at -10% 105%,#102639 0,transparent 60%);
  background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto}
.wrap{max-width:1120px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.05em;margin:0;text-wrap:balance}
h2{font-size:1.9rem}
h3{font-size:1.3rem}
p{margin:0}
.mute{color:var(--mute)}

.btn{font-family:var(--display);font-size:1.25rem;letter-spacing:.07em;min-height:52px;padding:12px 18px;border:2px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--paper);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;font-size:1rem;padding:8px 14px}

.chip{display:inline-block;font-family:var(--display);letter-spacing:.08em;font-size:.9rem;line-height:1;padding:4px 8px 3px;border:1.5px solid var(--c,var(--paper));color:var(--c,var(--paper));border-radius:3px}
.chip[data-el=fogo]{--c:var(--fogo)}.chip[data-el=agua]{--c:var(--agua)}.chip[data-el=vento]{--c:var(--vento)}.chip[data-el=raio]{--c:var(--raio)}.chip[data-el=terra]{--c:var(--terra)}
.chip.boss{--c:var(--seal)}

/* Menu */
.hero{text-align:center;padding:20px 0 8px}
.seal{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--seal);display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;color:var(--seal);box-shadow:inset 0 0 0 4px var(--ink),inset 0 0 0 6px var(--seal)}
.hero h1{font-size:clamp(2.6rem,9vw,4.4rem);line-height:1}
.hero h1::after{content:"";display:block;width:min(260px,60%);height:6px;margin:10px auto 0;background:var(--seal);border-radius:3px;transform:skewX(-24deg)}
.hero p{max-width:46ch;margin:16px auto 0;color:var(--mute)}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,4vw,36px);padding:24px 0 8px}
.hf svg{height:clamp(110px,26vw,170px);width:auto;display:block;filter:drop-shadow(0 0 14px color-mix(in srgb,currentColor 45%,transparent))}
.hf:nth-child(2) svg{height:clamp(124px,30vw,190px)}
.menu{display:grid;gap:10px;max-width:360px;margin:20px auto 0}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .cf{display:grid;place-items:center;height:140px}
.card .cf svg{height:100%;width:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:.85rem;align-items:center}
.mini .bar{height:6px}
.num{font-variant-numeric:tabular-nums}
.jlist{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.9rem}
.jlist li{display:flex;gap:8px}
.jlist b{font-weight:600;color:var(--paper)}
.jlist span{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}

/* Barras */
.bar{height:12px;background:#0007;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .55s ease}
.hp i{background:linear-gradient(90deg,#a82c1b,var(--hp))}
.ck i{background:var(--chakra)}
.xp i{background:var(--gold)}
.bars{display:grid;gap:4px}
.bl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute);letter-spacing:.04em}

/* Mapa */
.hud{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hud .hf svg{height:96px}
.missions{display:grid;gap:8px;margin-top:16px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mrow.lock{opacity:.45}
.mrow.open{border-color:var(--gold)}
.mn{font-family:var(--display);font-size:1.6rem;text-align:center;color:var(--mute)}
.mrow.done .mn{color:var(--good)}
.mrow.open .mn{color:var(--gold)}
.mtitle{font-weight:600;line-height:1.25}
.mrow>div{min-width:0}

/* Batalha */
.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#1c1526,#110c17 72%);overflow:hidden}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,transparent,#0006);pointer-events:none}
.side{position:relative;min-width:0;display:flex;flex-direction:column;gap:8px}
.tag{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.tag b{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.05em}
.fig{height:clamp(120px,34vw,210px);display:flex;align-items:flex-end;justify-content:center;margin-top:4px}
.fig svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 0 12px color-mix(in srgb,currentColor 40%,transparent))}
.foe .fig svg{transform:scaleX(-1)}
.foe.boss .fig svg{transform:scaleX(-1) scale(1.1);transform-origin:bottom center}
.fig.lungeR{animation:lungeR .45s}.fig.lungeL{animation:lungeL .45s}.fig.hit{animation:hit .4s}
.arena.shake{animation:shake .35s}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
.flash.on{animation:flash .55s}
.banner{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--display);font-size:clamp(1.4rem,5vw,2.1rem);letter-spacing:.1em;opacity:0;pointer-events:none;text-shadow:0 2px 0 #000,0 0 18px #000}
.banner.on{animation:ban 1s}
.dmg{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-family:var(--display);font-size:2.2rem;pointer-events:none;text-shadow:0 2px 0 #000;animation:rise 1.05s forwards;color:var(--paper)}
.dmg.adv{color:var(--gold);font-size:2.7rem}
.dmg.res{color:var(--mute)}
.dmg.heal{color:var(--good)}
.log{min-height:7.2em;margin:12px 0;padding:10px 14px;border-left:3px solid var(--seal);background:var(--panel);border-radius:0 6px 6px 0;font-size:.95rem;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.log p:last-child{color:var(--paper)}
.log p{color:var(--mute)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.actions.busy{opacity:.45;pointer-events:none}
.actions .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px}
.actions .btn small{font-family:var(--text);font-size:.78rem;letter-spacing:0;color:var(--mute)}
.actions.jut{grid-template-columns:1fr}
.jbtn{display:grid!important;grid-template-columns:1fr auto;align-items:center!important;text-align:left;gap:2px 12px!important}
.jbtn .jd{grid-column:1;font-family:var(--text);font-size:.82rem;letter-spacing:0;color:var(--mute)}
.jbtn .jc{grid-row:1/3;grid-column:2;text-align:right;font-size:1rem}
.adv{color:var(--gold)}
.res{color:var(--mute)}

/* Resultado / overlay */
.result{max-width:560px;margin:24px auto 0;text-align:center;display:grid;gap:16px;justify-items:center}
.result h2{font-size:clamp(2.4rem,9vw,3.6rem);line-height:1}
.win h2{color:var(--gold)}.lose h2{color:var(--seal)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;width:100%;text-align:left;display:grid;gap:8px}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.ov .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:560px;width:100%;display:grid;gap:12px}
.ov ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.cycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cycle span.ar{color:var(--mute)}

@keyframes lungeR{40%{transform:translateX(42px)}}
@keyframes lungeL{40%{transform:translateX(-42px)}}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(-7px);filter:brightness(2.4)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes flash{0%{opacity:0}20%{opacity:.8}100%{opacity:0}}
@keyframes ban{0%{opacity:0;transform:translateY(-8px)}15%,70%{opacity:1;transform:none}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-54px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:480px){.hud{grid-template-columns:1fr}.hud .hf{justify-self:center}.mrow{grid-template-columns:36px 1fr}.mrow .mact{grid-column:1/3}.mrow .mact .btn{width:100%}}

<script id="data">
/* ===== CAMADA DE DADOS (Dattebayo, cache e modo offline) ===== */
const DattebayoData=(()=>{
 const CACHE_KEY='caminho-ninja-dattebayo-v1',CACHE_TTL=24*60*60*1000;
 const BASES=['https://dattebayo-api.onrender.com','https://api-dattebayo.vercel.app'];
 const templates=ENEMIES.map(enemy=>({...enemy,js:enemy.js.map(j=>({...j}))}));
 const elements=['fogo','agua','vento','raio','terra'];
 const fallback=[
  ...ENEMIES.map(enemy=>({name:enemy.nome,clan:enemy.cla,village:enemy.village}))
 ];
 let state='loading',profiles=fallback,source='local';
 const readCache=()=>{
  try{
   const saved=JSON.parse(localStorage.getItem(CACHE_KEY));
   return saved&&Date.now()-saved.savedAt<CACHE_TTL&&Array.isArray(saved.profiles)?saved.profiles:null;
  }catch{return null}
 };
 const writeCache=data=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),profiles:data}))}catch{}};
 const field=value=>{
  if(typeof value==='string'&&value.trim())return value.trim();
  if(value&&typeof value==='object'&&!Array.isArray(value)&&typeof value.name==='string'&&value.name.trim())return value.name.trim();
  return 'Desconhecido';
 };
 const normalize=rows=>rows.map(item=>({
  id:field(item?.id),name:field(item?.name),clan:field(item?.clan),village:field(item?.village)
 })).filter(item=>item.name!=='Desconhecido').slice(0,10);
 const elementFor=profile=>{
  const key=String(profile.id!=='Desconhecido'?profile.id:`${profile.name}:${profile.clan}`);
  let hash=0;
  for(const char of key)hash=(hash*31+char.charCodeAt(0))>>>0;
  return elements[hash%elements.length];
 };
 const missionsFor=rows=>rows.slice(0,10).map((profile,index)=>{
  const template=templates[index],el=template.el;
  return{
  ...template,el,clan:template.cla,village:template.village,
   js:template.js.map(j=>({...j}))
  };
 });
 const applyMissions=()=>ENEMIES.splice(0,ENEMIES.length,...missionsFor(profiles));
 async function request(base){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{
   const response=await fetch(`${base}/characters?page=1&limit=10`,{signal:controller.signal});
   if(!response.ok)throw new Error(`HTTP ${response.status}`);
   const payload=await response.json(),rows=Array.isArray(payload)?payload:payload?.characters;
   if(!Array.isArray(rows)||!rows.length)throw new Error('Resposta sem personagens');
   console.info('[Caminho Ninja] Campos Dattebayo:',Object.keys(rows[0]));
   const data=normalize(rows);
   if(!data.length)throw new Error('Resposta sem nomes utilizáveis');
   return data;
  }finally{clearTimeout(timer)}
 }
 async function load(){
  const cached=readCache();
  const cachedProfiles=cached?normalize(cached):[];
  if(cachedProfiles.length){profiles=cachedProfiles;source='cache';state='ready';applyMissions();return profiles}
  for(let i=0;i<BASES.length;i++){
   try{
    profiles=await request(BASES[i]);source=i===0?'principal':'reserva';state='ready';writeCache(profiles);applyMissions();return profiles;
   }catch(error){console.warn(`[Caminho Ninja] API ${i===0?'principal':'reserva'} indisponível:`,error)}
  }
  profiles=fallback;source='local';state='offline';applyMissions();return profiles;
 }
 const status=()=>state==='loading'?'Convocando ninjas...':state==='offline'?'Modo offline · 10 ninjas locais':`Arquivo ${source} · ${profiles.length} ninjas`;
 return{load,status,get profiles(){return profiles},get state(){return state}};
})();
</script>

 return `<div class="top"><h2>Mapa de missões</h2><div class="row"><button class="btn ghost small" data-act="profile">Meu ninja</button><button class="btn ghost small" data-act="training">Treino</button><button class="btn ghost small" data-act="story">História</button><button class="btn ghost small" data-act="how">Como jogar</button><button class="btn ghost small" data-act="menu">Menu</button></div></div>
 <div class="hud"><div class="hf" style="color:var(--${c.el})">${fig(skin.look||c.look)}</div>
  <div class="bars"><div class="spread"><h3>${c.nome} · ${rank(save.lv)}</h3>${chip(c.el)}</div>
  <div class="bl"><span>Nível ${save.lv}</span><span class="num">${save.xp} / ${need(save.lv)} XP</span></div>
  <div class="mute num" style="font-size:.82rem">XP gastável: ${save.xpGastavel||0}</div>
   <div class="bar xp"><i style="width:${pct(save.xp,need(save.lv))}%"></i></div>
   <div class="mute num" style="font-size:.85rem">HP ${s.hp} · Chakra ${s.ck} · Ataque ${s.atk} · Defesa ${s.def} · Veloc. ${s.spd}</div>
   <div class="mute" style="font-size:.85rem">Jutsus: ${unlocked(c,save.lv).map(j=>j.n).join(', ')}</div></div></div>
 <div class="missions">${ENEMIES.map((e,i)=>{
  const st=i<save.cleared?'done':i===save.cleared?'open':'lock';
  return `<div class="mrow ${st}"><div class="mn">${i+1}</div>
  <div><div class="mtitle">${e.nome}</div><div class="mute" style="font-size:.82rem">${e.clan||'Clã desconhecido'} · ${e.village||'Vila desconhecida'}</div><div class="row" style="margin-top:4px">${chip(e.el)}${e.boss?'<span class="chip boss">Chefe</span>':''}<span class="mute num" style="font-size:.85rem">${st==='done'?'Concluída · XP reduzido':'+'+reward(i)+' XP'}</span></div></div>
   <div class="mact"><button class="btn small ${st==='open'?'primary':''}" data-act="fight" data-i="${i}" ${st==='lock'?'disabled':''}>${st==='done'?'Repetir':st==='open'?'Lutar':'Bloqueada'}</button></div></div>`}).join('')}</div>`;
}
function profileView(){
 const c=CLASSES[save.cls],owned=SKINS.slice(0,Math.min(SKINS.length,1+Math.floor(save.cleared/2)));
 return `<div class="top"><h2>Meu ninja</h2><button class="btn ghost small" data-act="map">Voltar ao mapa</button></div>
 <div class="hud"><div class="hf" style="color:var(--${c.el})">${fig((SKINS.find(s=>s.id===save.skin)?.look)||c.look)}</div><div><h3>${c.nome}</h3><p class="mute">${c.cla} · ${rank(save.lv)} · Nível ${save.lv}</p><p class="mute" style="margin-top:8px">A aparência não altera atributos ou regras de batalha.</p></div></div>
 <div class="grid">${owned.map(s=>`<div class="card"><div class="cf" style="color:var(--${c.el})">${fig(s.look||c.look)}</div><div class="spread"><h3>${s.n}</h3>${save.skin===s.id?'<span class="adv">Equipado</span>':''}</div><button class="btn ${save.skin===s.id?'':'primary'}" data-act="skin" data-skin="${s.id}" ${save.skin===s.id?'disabled':''}>${save.skin===s.id?'Em uso':'Equipar'}</button></div>`).join('')}</div>`;
}
function trainingView(){
 return `<div class="top"><h2>Arena de treinamento</h2><button class="btn ghost small" data-act="map">Voltar ao mapa</button></div>
 <p class="mute">Escolha um adversário da história para sparring. O treino não concede XP nem altera a campanha.</p>
 <div class="panel" style="margin-top:16px"><label>HP do alvo <input name="train-hp" type="number" min="50" max="500" value="180"></label>
 <label>Defesa do alvo <input name="train-def" type="number" min="0" max="20" value="8"></label>
 <label>Adversário <select name="train-enemy">${ENEMIES.map((e,i)=>`<option value="${i}">${e.nome} · ${e.cla}</option>`).join('')}</select></label>
 <button class="btn primary" data-act="start-training">Iniciar treino</button></div>`;
}
function storyView(){
 const mi=Math.min(save.storyMission||0,ENEMIES.length-1),chapter=mi<3?0:mi<7?1:2,chapters=['Ecos da Folha','Sombras da Névoa','O último selo'];
 const speaker=storyStage?ENEMIES[mi].nome:chapter===0?'Kakashi Hatake':chapter===1?'Tsunade':'Minato Namikaze';
 const dialogue=ENEMIES[mi].historia;
 return `<div class="top"><h2>Modo história</h2><button class="btn ghost small" data-act="map">Voltar ao mapa</button></div>
 <div class="panel"><span class="chip">Capítulo ${chapter+1}</span><h3>${chapters[chapter]}</h3>
 <p><b>${speaker}</b></p><p>${storyStage?`${ENEMIES[mi].nome} prepara-se para lutar. ${dialogue}`:dialogue}</p><p class="mute">Missão ${mi+1} de ${ENEMIES.length}: ${ENEMIES[mi].nome}</p>
 <div class="row">${storyStage?`<button class="btn primary" data-act="story-fight" data-i="${mi}">Lutar</button>`:`<button class="btn primary" data-act="story-next-dialogue">Continuar</button>`}<button class="btn" data-act="story-skip" data-i="${mi}">Pular diálogo</button></div></div>`;
}
function battleView(){
 const p=B.p,e=B.e;
 const side=(f,cls,look,boss)=>`<div class="side ${cls} ${boss?'boss':''}">
  <div class="tag"><b>${f.n}</b>${chip(f.el)}</div>
  <div class="bars"><div class="bl"><span>HP</span><span class="num" data-t="hp-${cls}"></span></div><div class="bar hp"><i data-b="hp-${cls}"></i></div>
  <div class="bl"><span>Chakra</span><span class="num" data-t="ck-${cls}"></span></div><div class="bar ck"><i data-b="ck-${cls}"></i></div></div>
  <div class="fig" style="color:var(--${f.el})">${portrait(cls==='you'?CLASSES[save.cls].look:look,f.n)}</div></div>`;
 return `<div class="top"><h3>${B.training?'Arena de treino':`Missão ${B.mi+1}${ENEMIES[B.mi].boss?' · Chefe':''}`} · Rodada <span id="rd" class="num">1</span></h3><button class="btn ghost small" data-act="flee">${B.training?'Encerrar treino':'Fugir'}</button></div>
 <div class="arena" id="arena">${side(p,'you',CLASSES[save.cls].look)}${side(e,'foe',ENEMIES[B.mi].look,ENEMIES[B.mi].boss)}
  <div class="flash" id="flash"></div><div class="banner" id="banner"></div></div>
 <div class="log" id="log" aria-live="polite"></div>
 <div class="actions" id="actions"></div>`;
}
function resultView(){
 const r=R,c=CLASSES[save.cls];
 const next=r.win&&B.mi+1<ENEMIES.length;
 return `<div class="result ${r.win?'win':'lose'}"><h2>${r.win?'Vitória':'Derrota'}</h2>
  <p class="mute">${r.win?`${ENEMIES[B.mi].nome} foi derrotado.`:`${ENEMIES[B.mi].nome} venceu desta vez. Treine em missões anteriores e tente de novo.`}</p>
  <div class="panel"><div class="spread"><b>+${r.xp} XP</b><span class="mute">Nível ${save.lv} · ${rank(save.lv)}</span></div>
   <div class="bar xp"><i style="width:${pct(save.xp,need(save.lv))}%"></i></div>
   ${save.lv>r.before.lv?`<div class="adv">Subiu do nível ${r.before.lv} para o ${save.lv}. Atributos aumentaram.</div>`:''}
   ${r.rankUp?`<div class="adv">Promoção: você agora é ${rank(save.lv)}.</div>`:''}
   ${r.newJ.map(j=>`<div><b class="adv">Novo jutsu: ${j.n}</b><div class="mute" style="font-size:.9rem">${j.d}</div></div>`).join('')}
  ${r.final?`<div class="adv">Campanha concluída. ${c.nome} venceu Madara Uchiha.</div>`:''}</div>
  <div class="row" style="justify-content:center">${r.story&&r.win?`<button class="btn primary" data-act="story">Continuar história</button>`:''}${next?`<button class="btn primary" data-act="fight" data-i="${B.mi+1}">Próxima missão</button>`:''}
  ${!r.win?`<button class="btn primary" data-act="${r.story?'story-retry':'fight'}" data-i="${B.mi}">Tentar de novo</button>`:''}
   <button class="btn" data-act="map">Mapa</button></div></div>`;
}
function howView(){
 const order=['fogo','vento','raio','terra','agua'];
 return `<div class="ov"><div class="box"><h2>Como jogar</h2>
 <ul><li><b>Ataque:</b> sem custo, dano básico.</li>
 <li><b>Jutsu:</b> gasta chakra e causa mais dano. Mostra se o elemento tem vantagem.</li>
 <li><b>Defender:</b> corta o dano recebido na rodada pela metade e recupera 3 de chakra.</li>
 <li><b>Item:</b> uma pílula por batalha, recupera 40% do HP.</li>
 <li>O chakra regenera +2 por rodada. Quem tem mais velocidade age primeiro.</li>
 <li>Vencer dá XP. Em missões já concluídas o XP é menor. Em derrota você ganha um pouco de XP.</li></ul>
 <div><b>Ciclo de elementos</b> (vantagem x1.5, desvantagem x0.75)</div>
 <div class="cycle">${order.concat('fogo').map(chip).join('<span class="ar">vence</span>')}</div>
 <button class="btn primary" data-act="closehow">Entendi</button></div></div>`;
}

function render(){
 let h='';
 if(view==='menu')h=menuView();else if(view==='class')h=classView();else if(view==='map')h=mapView();
 else if(view==='battle')h=battleView();else if(view==='result')h=resultView();
 else if(view==='profile')h=profileView();else if(view==='training')h=trainingView();else if(view==='story')h=storyView();
 app.innerHTML=h+(how?howView():'');
 if(view==='battle'){upd();showActions('main');renderLog()}
 window.scrollTo({top:0});
}

/* ---- Batalha ---- */
function startBattle(i,training=false,config={}){
  const c=CLASSES[save.cls],st=stats(c,save.lv),en=ENEMIES[i],es=enemyStats(i);
  const playerHp=st.hp,enemyHp=training?Math.max(50,Math.min(500,config.hp)):es.hp;
 B={mi:i,busy:false,over:false,item:1,round:1,log:[],training,story:!!config.story,
    p:{n:c.nome,el:c.el,mhp:playerHp,hp:playerHp,mck:st.ck,ck:Math.round(st.ck*.6),atk:st.atk,def:st.def,spd:st.spd,js:unlocked(c,save.lv),gd:false},
     e:{n:en.nome,el:en.el,mhp:enemyHp,hp:enemyHp,mck:es.ck,ck:training?0:Math.round(es.ck*.6),atk:training?0:es.atk,def:training?Math.max(0,Math.min(20,config.def)):es.def,spd:training?0:es.spd,js:training?[]:en.js,gd:false,lastDef:false}};
   B.log.push(`${B.e.n} bloqueia o caminho. ${en.historia}`);
 view='battle';render();
}
const say=t=>{B.log.push(t);if(B.log.length>5)B.log.shift();renderLog()};
function renderLog(){const l=$('#log');if(l)l.innerHTML=B.log.map(t=>`<p>${t}</p>`).join('')}
function upd(){
 [['you',B.p],['foe',B.e]].forEach(([s,f])=>{
  const set=(k,v,m)=>{const b=$(`[data-b="${k}-${s}"]`),t=$(`[data-t="${k}-${s}"]`);if(b)b.style.width=pct(v,m)+'%';if(t)t.textContent=Math.max(0,Math.round(v))+' / '+m};
  set('hp',f.hp,f.mhp);set('ck',f.ck,f.mck)});
 const r=$('#rd');if(r)r.textContent=B.round;
}
function pulse(n,c,ms){if(!n)return;n.classList.remove(c);void n.offsetWidth;n.classList.add(c);setTimeout(()=>n.classList.remove(c),ms)}
function floatTxt(side,txt,cls){const s=$('.side.'+side);if(!s)return;const d=document.createElement('span');d.className='dmg '+(cls||'');d.textContent=txt;s.appendChild(d);setTimeout(()=>d.remove(),1150)}
function banner(t,el){const b=$('#banner');if(!b)return;b.textContent=t;b.style.color=el?`var(--${el})`:'var(--paper)';pulse(b,'on',1000)}
function flash(el){const f=$('#flash');if(!f)return;f.style.background=`radial-gradient(circle at 50% 55%,var(--${el}),transparent 70%)`;pulse(f,'on',560)}

async function act(a,t,ac){
 const as=a===B.p?'you':'foe',ts=as==='you'?'foe':'you';
 const figA=$(`.side.${as} .fig`),figT=$(`.side.${ts} .fig`);
 if(ac.t==='def'){a.ck=Math.min(a.mck,a.ck+3);say(`${a.n} se defende e recupera chakra.`);upd();await sleep(500);return}
 if(ac.t==='item'){const h=Math.round(a.mhp*.4);a.hp=Math.min(a.mhp,a.hp+h);B.item=0;floatTxt(as,'+'+h,'heal');say(`${a.n} usa a Pílula de Soldado e recupera ${h} HP.`);upd();await sleep(700);return}
 let power=1,el=null,pierce=false,drain=0,label='Ataque básico';
 if(ac.t==='jutsu'){const j=ac.j;a.ck-=j.c;power=j.p;el=j.el||a.el;pierce=!!j.pierce;drain=j.drain||0;label=j.n}
 banner(label,el);if(el)flash(el);
 pulse(figA,as==='you'?'lungeR':'lungeL',450);
 await sleep(300);
 const m=(el&&!(ac.j&&ac.j.neutral))?mult(el,t.el):1,d=calc(a,power,m,t,pierce);
 t.hp=Math.max(0,t.hp-d);
 pulse(figT,'hit',400);pulse($('#arena'),'shake',350);
 floatTxt(ts,'-'+d,m>1?'adv':m<1?'res':'');
 say(`${a.n} usa ${label}: ${d} de dano${m>1?' (vantagem elemental)':m<1?' (resistido)':''}${t.gd?' (defendido)':''}.`);
 if(drain){const h=Math.round(d*drain);a.hp=Math.min(a.mhp,a.hp+h);floatTxt(as,'+'+h,'heal')}
 upd();await sleep(650);
}
async function doRound(pa){
 if(!B||B.busy||B.over)return;
 B.busy=true;showActions('busy');
 if(B.training){
  B.p.gd=false;await act(B.p,B.e,pa);
  if(!B)return;
  if(B.e.hp<=0){B.e.hp=B.e.mhp;say('Alvo reiniciado. Nenhum XP ou progresso foi concedido.')}
  B.p.ck=Math.min(B.p.mck,B.p.ck+2);B.round++;upd();B.busy=false;showActions('main');return;
 }
 const ea=aiPick(B.e);
 B.p.gd=pa.t==='def';B.e.gd=ea.t==='def';B.e.lastDef=B.e.gd;
 const order=B.p.spd>=B.e.spd?[[B.p,B.e,pa],[B.e,B.p,ea]]:[[B.e,B.p,ea],[B.p,B.e,pa]];
 for(const [a,t,ac] of order){if(a.hp<=0||t.hp<=0)break;await act(a,t,ac);if(!B)return}
 if(B.e.hp<=0)return finish(true);
 if(B.p.hp<=0)return finish(false);
 B.p.ck=Math.min(B.p.mck,B.p.ck+2);B.e.ck=Math.min(B.e.mck,B.e.ck+2);
 B.p.gd=false;B.e.gd=false;B.round++;
 upd();B.busy=false;showActions('main');
}
async function finish(win){
  if(B.training){
    B.p.hp=B.p.mhp;B.p.ck=B.p.mck;B.e.hp=B.e.mhp;B.round=1;B.p.gd=false;B.e.gd=false;
    say('Treino encerrado. HP e Chakra restaurados; nenhum progresso foi gravado.');upd();B.busy=false;showActions('main');return;
  }
 B.over=true;
 say(win?`${B.e.n} caiu. Missão cumprida.`:`${B.p.n} desmaiou.`);
 await sleep(1100);
 if(!B)return;
 const i=B.mi,first=B.story?!(save.storyCleared||[]).includes(i):i===save.cleared,base=reward(i);
 const xp=win?Math.round(base*(first?1:.4)):Math.round(base*.2);
 const before={lv:save.lv};
 save.xp+=xp;save.xpTotal=(save.xpTotal||0)+xp;if(win)save.xpGastavel=(save.xpGastavel||0)+xp;
 while(save.xp>=need(save.lv)){save.xp-=need(save.lv);save.lv++}
 let final=false;
 if(win&&first&&!B.story){save.cleared=Math.min(ENEMIES.length,i+1);final=save.cleared===ENEMIES.length}
 if(win&&B.story){save.storyCleared=save.storyCleared||[];if(!save.storyCleared.includes(i))save.storyCleared.push(i);save.storyMission=Math.min(i+1,ENEMIES.length-1)}
 store(save);
 R={win,xp,before,final,story:B.story,rankUp:rank(save.lv)!==rank(before.lv),newJ:CLASSES[save.cls].jutsus.filter(j=>j.lv>before.lv&&j.lv<=save.lv)};
 view='result';render();
}
function showActions(mode){
 const box=$('#actions');if(!box||!B)return;
 const p=B.p;
 box.className='actions';
 if(mode==='busy'){box.classList.add('busy');return}
 if(mode==='jutsu'){
  box.classList.add('jut');
  box.innerHTML=p.js.map(j=>{const m=mult(j.el||p.el,B.e.el);
   const tip=m>1?'<span class="adv">Vantagem x1.5</span>':m<1?'<span class="res">Desvantagem x0.75</span>':'Neutro';
   return `<button class="btn jbtn" data-act="jutsu" data-j="${j.id}" ${j.c>p.ck?'disabled':''}><span>${j.n}</span><span class="jc num">${j.c} chakra</span><span class="jd">${j.d} ${tip}${j.pierce?' · Ignora defesa':''}${j.drain?' · Cura':''}</span></button>`}).join('')+
   `<button class="btn ghost" data-act="back">Voltar</button>`;
  return;
 }
 box.innerHTML=`<button class="btn" data-act="atk">Ataque<small>Sem custo</small></button>
  <button class="btn" data-act="jmenu">Jutsu<small>Gasta chakra</small></button>
  <button class="btn" data-act="gd">Defender<small>Dano pela metade, +3 chakra</small></button>
  <button class="btn" data-act="item" ${B.item?'':'disabled'}>Item<small>${B.item?'Pílula: +40% HP':'Já usado'}</small></button>`;
}

/* ---- Eventos ---- */
app.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act;
 if(a==='new'){
  if(save&&!confirmNew){confirmNew=true;clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{confirmNew=false;if(view==='menu')render()},4000);render();return}
  confirmNew=false;view='class';render();
 }else if(a==='cont'){if(save){view='map';render()}}
 else if(a==='menu'){confirmNew=false;view='menu';render()}
 else if(a==='how'){how=true;render()}
 else if(a==='closehow'){how=false;render()}
 else if(a==='pick'){save={cls:b.dataset.c,lv:1,xp:0,xpTotal:0,xpGastavel:0,cleared:0,skin:sel||'default',storyMission:0};store(save);view='map';render()}
 else if(a==='profile'){view='profile';render()}
 else if(a==='skin'){const owned=SKINS.slice(0,Math.min(SKINS.length,1+Math.floor(save.cleared/2)));if(owned.some(s=>s.id===b.dataset.skin)){save.skin=b.dataset.skin;store(save);render()}}
 else if(a==='training'){view='training';render()}
 else if(a==='start-training'){
  const read=(name,min,max)=>Math.max(min,Math.min(max,Number($(`[name="${name}"]`).value)||min));
  startBattle(Number($('[name="train-enemy"]').value),true,{hp:read('train-hp',50,500),def:read('train-def',0,20)});
 }
 else if(a==='story'){storyStage=0;view='story';render()}
 else if(a==='story-next-dialogue'){storyStage=1;render()}
 else if(a==='story-fight'||a==='story-skip'||a==='story-retry'){
  const mission=Math.min(Number(b.dataset.i)||0,ENEMIES.length-1);
  save.storyMission=mission;store(save);
  startBattle(mission,false,{story:true});
 }
 else if(a==='map'){B=null;view='map';render()}
 else if(a==='fight'){startBattle(+b.dataset.i)}
 else if(a==='flee'){if(B?.training){B.p.hp=B.p.mhp;B.p.ck=B.p.mck;B=null;view='training'}else{B=null;view='map'}render()}
 else if(a==='atk')doRound({t:'atk'});
 else if(a==='gd')doRound({t:'def'});
 else if(a==='item')doRound({t:'item'});
 else if(a==='jmenu')showActions('jutsu');
 else if(a==='back')showActions('main');
 else if(a==='jutsu'){const j=B.p.js.find(x=>x.id===b.dataset.j);if(j&&j.c<=B.p.ck)doRound({t:'jutsu',j})}
});
app.addEventListener('change',ev=>{
 if(ev.target.matches('[name="skin-preview"]')){sel=ev.target.value;render()}
});
render();
DattebayoData.load().then(()=>{
 const status=$('#data-status');
 if(status)status.textContent=DattebayoData.status();
});
})();
</script>

</body></html>
